aid: vela-fka-sr-labs
name: Vela (FKA SR Labs)
description: Vela Trading Technologies (formerly SR Labs) was a New York-based provider
  of low-latency market data feed handlers, execution gateways, and multi-asset trading
  platforms (SuperFeed, Metro, DMA Platform) for capital markets, surfaced here as
  an Insight Partners portfolio company. Vela merged into Exegy in May 2021 and no
  longer operates independently - tradevela.com is offline (HTTPS refused at probe
  time) while its DNS now points at Exegy mail infrastructure. Vela published no
  self-serve public HTTP API; SuperFeed was delivered via the open-source OpenMAMA
  API (C++/C#/Java) with an OpenMAMA Developer Program, and its 2017 OptionsCity
  acquisition exposed the now-decommissioned City Trader REST API, for which a
  first-party Python client survives on the legacy GitHub org. See the exegy profile
  for the successor company's current surface.
