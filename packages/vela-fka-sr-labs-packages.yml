notes: >-
  Vela (FKA SR Labs) merged into Exegy in May 2021 and no longer operates
  independently; tradevela.com and the OptionsCity API hosts
  (devapi.optionscity.com) are offline. The single first-party client library
  below remains published on the legacy GitHub org (github.com/tradevela) but
  targets the decommissioned City Trader REST API from OptionsCity, which Vela
  acquired in 2017. It was never published to PyPI (checked 2026-07-21:
  pypi.org/pypi/citytrader and /city-trader both 404). The org's other two
  repos (techan.js, Alert7.js) are forks, not first-party. Vela's SuperFeed
  market data was delivered via the open-source OpenMAMA API (C++/C#/Java), a
  FINOS/Linux Foundation project rather than a first-party package.
packages:
